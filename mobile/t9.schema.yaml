# Rime schema
# encoding: utf-8

# 适配了仓输入法 [Hamster](https://github.com/imfuxiao/Hamster/) 九宫格布局。
#
# 可选，支持英文：
# 1. 解开 `engine/translators` 下的注释
# 2. 将 `others/Hamster/melt_eng.custom.yaml` 里的文件拷贝至配置目录，该补丁转写了英文的拼写规则到九宫格；

__include: rime_ice.schema.yaml:/

t9:
  # 是否显示 rime 中原始的预编辑文本，默认为 true
  # true: 对 preedit 不做处理，显示 rime 返回的原始 preedit 值。
  #       如果想通过 lua 自己调整 preedit 的显示，可以设置为 true。
  # false: 根据候选字 comment 显示转换后的 preedit 内容。
  #        注意：请务必保证候选字 comment 有效且正确，否则可能导致预编辑文本显示异常。
  isDisplayOriginalPreedit: false

schema:
  schema_id: t9
  name: 中文九键
  version: "3.0.0"
  author:
    - Dvel
    - "[morse.hsiao](https://github.com/imfuxiao)"
  description: |
    中文九键 for 仓输入法 & 元书输入法
  dependencies:
    - melt_eng     # 英文输入，作为次翻译器挂载到拼音方案
    - melt_eng_t9  # 同一份英文词典的九宫格数字索引（melt_eng_t9.schema.yaml）

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator # 时间、日期、星期
    - table_translator@custom_phrase # 自定义短语 custom_phrase_t9.txt
    - lua_translator@*uuid          # UUID，与 26 键一致：划出 uuid 即生成一个
    - table_translator@melt_eng         # 英文输入：按数字键打（中英混输）
    - table_translator@melt_eng_letters # 英文输入：滑动划出字母时按字母打
    - lua_translator@*calc_translator    # 计算器
    - lua_translator@*force_gc           # 暴力 GC
  filters:
    - simplifier@emoji # Emoji
    - simplifier@traditionalize # 简繁切换
    - uniquifier # 去重

calculator:
  prefix: =
  show_prefix: true

# 处理符合特定规则的输入码，如网址、反查
recognizer:
  import_preset: default                # 从 default.yaml 继承通用的
  patterns:                             # 再增加方案专有的：
    calculator: "^=.+"                 # 响应 lua_translator@*calc_translator，计算器。前缀设定项 calculator/prefix

translator:
  prism: t9
  spelling_hints: 100
  comment_format: []
  # dictionary_exclude: [肏屄, 鸡巴]  # 如有屏蔽 NSFW 词汇需求 librime >= 1.14.0 等价于从 .dict.yaml 中删除对应词条，但不影响组句和用户词库。

# 自定义短语：custom_phrase_t9.txt
# ⚠️ 编码要用数字
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_t9
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

# 英文次翻译器：与 26 键中文下的中英混输保持同一条规则——只给拼全的词，
# 不做前缀补全，否则每串数字都会带出一长串英文候选。专用英文模式（melt_eng
# 方案本身）有自己的规则，在 melt_eng.custom.yaml 里补全是开着的。
# 整块写全，不依赖 __include 的合并：这一节覆盖 rime_ice.schema.yaml 里的同名节点，
# 只写 prism 的话 dictionary 有可能一起被顶掉，英文就整个不出候选了。
melt_eng:
  dictionary: melt_eng     # 与 26 键英文模式同一份词库
  prism: melt_eng_t9       # 拼写索引换成数字版，数字串也能打出英文词
  enable_sentence: false
  enable_user_dict: false
  enable_completion: false # 与 26 键中文下的中英混输一致：只给拼全的词
  initial_quality: 1.1
  comment_format:
    - xform/.*//

# 同一份英文词典的字母索引。九宫格可以滑动划出确切的字母（Claude），那串字母
# 对不上数字索引，所以字母和数字两条路各挂一个翻译器；两份索引本来就都在
# （melt_eng.prism.bin 3.2 MB 给英文模式用，melt_eng_t9.prism.bin 804 KB 给数字用），
# 不增加存储。
melt_eng_letters:
  dictionary: melt_eng
  prism: melt_eng
  enable_sentence: false
  enable_user_dict: false
  enable_completion: false
  initial_quality: 1.1
  comment_format:
    - xform/.*//

# 九宫格 1 键上的符号序列
punctuator:
  half_shape:
    "1": [1, "@", ".", "/", ":", "_", "-", "#"]
    "@": [1, "@", ！, ：, 、, ……, ～]
    "#": [0, "#", "$", "%", "^", "&", "*", "(", ")"]

# 输入时按 1 可以分词
key_binder:
  bindings:
    - { when: has_menu, accept: 1, send: apostrophe }

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210=
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA9876543210=
  algebra:
    # ### 超级简拼
    - abbrev/^([a-z]).+$/$1/ # 超级简拼
    - abbrev/^([zcs]h).+$/$1/ # 超级简拼中，zh ch sh 视为整体（ch'sh → 城市），而不是像这样分开（c'h's'h → 吃好睡好）。
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    # ### 九宫格数字映射
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[hgi]/4/
    - derive/[jkl]/5/
    - derive/[omn]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/
