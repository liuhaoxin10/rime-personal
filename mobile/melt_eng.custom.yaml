# Hare 的英文方案补丁。
patch:
  # 专用英文模式：边打边补全，这里的词库就是英文输入的词库。中文下的中英混输
  # 走的是 rime_ice / t9 里的 melt_eng 次翻译器，那两处仍然关着补全，免得每个
  # 拼音前缀都拖出一串英文候选（见 rime_ice.custom.yaml、t9.schema.yaml）。
  translator/enable_completion: true
  # 英文拼写规则 = 雾凇 algebra_rime_ice 展开后，去掉 9 条「前 2～10 个字母大写」的派生规则
  # （derive/^([a-z]{n})/\U$1/）。它们只服务 GIthub、JAVascript 这类写法，却让拼写索引
  # melt_eng.prism.bin 大了好几倍。首字母大写（Hello）和全大写（WIFI）两条保留：
  # 中文模式下大写字母会进入组字，去掉它们 Hello、Github、Iphone 就没有英文候选了。
  # 对比数据见 tasks/typing-overhaul/README.md 第 24 轮（checks/run-dict-variant-probe.sh）。
  # 补丁只能整体替换展开后的列表：上游改动 algebra_common 时需要重新生成这一段。
  speller/algebra:
    - "derive/1([4-7|9])/$1teen/"
    - "derive/11/eleven/"
    - "derive/12/twelve/"
    - "derive/13/thirteen/"
    - "derive/15/fifteen/"
    - "derive/18/eighteen/"
    - "derive/0/o/"
    - "derive/0/O/"
    - "derive/0/zero/"
    - "derive/1/one/"
    - "derive/10/ten/"
    - "derive/2/to/"
    - "derive/2/two/"
    - "derive/3/three/"
    - "derive/4/for/"
    - "derive/4/four/"
    - "derive/5/five/"
    - "derive/6/six/"
    - "derive/7/seven/"
    - "derive/8/eight/"
    - "derive/9/nine/"
    - "derive/\\+/plus/"
    - "derive/\\./dot/"
    - "derive/@/at/"
    - "derive/-/hyphen/"
    - "derive/#/hash/"
    - "derive/#/number/"
    - "derive/#/sharp/"
    - "derive/♯/sharp/"
    - "derive / slash"
    - "derive/&/and/"
    - "derive/%/percent/"
    - "derive/[.]//"
    - "derive/[+]//"
    - "derive/[@]//"
    - "derive/[-]//"
    - "derive/[_]//"
    - "derive/[^a-zA-Z0-9]//"
    - "erase/^[^a-zA-Z0-9].+$/"
    - "derive/^.{4,}$/\\L$0/"
    - "derive/^.+$/\\U$0/"
    - "derive/^./\\U$0/"
    - "erase/^[a-z]$/"
    - "derive/(?<!\\d)1([1-9])(?!\\d)/shi$1/"
    - "derive/([1-9])0000(?!0)/$1wan/"
    - "derive/([1-9])000(?!0)/$1qian/"
    - "derive/([1-9])00(?!0)/$1bai/"
    - "derive/([2-9])0(?!0)/$1shi/"
    - "derive/(?<!\\d)([2-9])([1-9])(?!\\d)/$1shi$2/"
    - "derive/\\./dian/"
    - "derive/10/shi/"
    - "derive/0/ling/"
    - "derive/1/yi/"
    - "derive/2/er/"
    - "derive/2/liang/"
    - "derive/3/san/"
    - "derive/4/si/"
    - "derive/5/wu/"
    - "derive/6/liu/"
    - "derive/7/qi/"
    - "derive/8/ba/"
    - "derive/9/jiu/"
    - "derive/\\+/jia/"
    - "derive/#/jing/"
