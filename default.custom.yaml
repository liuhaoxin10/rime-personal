# Rime custom settings
# encoding: utf-8
#
# 个人全局配置。重新部署后会 patch 到 default.yaml，
# 避免直接修改上游配置文件。

patch:
  # 全拼仍放在首位；同时启用手机九键，供紫毫切换九键布局时使用。
  schema_list:
    - schema: rime_ice
    - schema: t9
  menu/page_size: 7
  ascii_composer/switch_key/Caps_Lock: commit_code
  ascii_composer/switch_key/Shift_L: noop
